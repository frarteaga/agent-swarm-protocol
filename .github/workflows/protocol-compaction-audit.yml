name: protocol-compaction-audit

on:
  pull_request:
    paths:
      - '.agent/**/*.md'
      - 'scripts/measure_agent_context.py'
      - 'scripts/audit_protocol_semantics.py'
      - 'scripts/check_protocol_structure.py'
      - 'scripts/check_review_corrections.py'
      - 'docs/compaction/**'
      - '.github/workflows/protocol-compaction-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned tokenizer
        run: python -m pip install 'tiktoken==0.13.0'
      - name: Measure baseline and current bundles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/measure_agent_context.py --encoding o200k_base --ref "$HEAD_SHA" --compare-ref "$BASE_SHA" --minimum-startup-reduction 30
      - name: Duplicate and RFC 2119 audits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo '=== BASELINE AUDIT ==='
          python scripts/audit_protocol_semantics.py --ref "$BASE_SHA" --threshold 0.55
          echo '=== CURRENT AUDIT ==='
          python scripts/audit_protocol_semantics.py --ref "$HEAD_SHA" --threshold 0.55
      - name: Structural semantic tripwires
        run: python scripts/check_protocol_structure.py
      - name: Independent-review correction tripwires
        run: python scripts/check_review_corrections.py
